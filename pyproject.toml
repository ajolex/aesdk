[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aesdk"
version = "0.1.0"
description = "Agentic Econometrics SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "AESDK Contributors"},
]
maintainers = [
  {name = "AESDK Contributors"},
]
keywords = [
  "econometrics",
  "causal-inference",
  "ai-agents",
  "research-automation",
  "pre-analysis-plan",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "jsonschema>=4.20.0",
  "PyYAML>=6.0.1",
  "typer>=0.12.3",
  "requests>=2.32.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "statsmodels>=0.14.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]
cloud-kms = [
  "boto3>=1.34.0",
  "cryptography>=42.0.0",
  "google-cloud-kms>=2.24.0",
  "azure-identity>=1.17.0",
  "azure-keyvault-keys>=4.9.0",
]
llm = [
  "openai>=1.40.0",
  "anthropic>=0.34.0",
]

[project.urls]
Homepage = "https://github.com/ajolex/aesdk"
Repository = "https://github.com/ajolex/aesdk"
Issues = "https://github.com/ajolex/aesdk/issues"
Documentation = "https://github.com/ajolex/aesdk#readme"

[project.scripts]
aesdk = "aesdk.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aesdk = [
  "governance/rules/*.yaml",
  "governance/schemas/*.yaml",
  "sandbox/*.yaml",
  "knowledge/*.yaml",
  "agent/templates/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
