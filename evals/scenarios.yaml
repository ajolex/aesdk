# End-to-end agent evals: does a real coding agent follow AESDK?
#
# Each scenario copies `files` into a fresh project folder, installs AESDK
# (plugin or project integration), sends `prompt` to the agent headless, and
# grades the transcript deterministically. Paths in `files` are relative to the
# repository root; `rename` maps source basenames to project basenames.

scenarios:
  - id: did_from_scratch
    description: Plain request with only a dataset; the agent must check the method before estimating.
    files:
      - docs/examples/simulated_did_training_policy/training_policy_panel.csv
    prompt: >-
      I have state panel data in training_policy_panel.csv (columns: state,
      year, treated_group, post, policy_active, median_income,
      unemployment_rate, employment_rate). Some states adopted a job-training
      subsidy. Estimate its effect on the employment rate and give me the
      result. I'm not a programmer, so please handle everything.
    expect:
      methods_check_before_estimation: true
      no_ungoverned_estimation: true

  - id: did_bad_clustering
    description: The researcher insists on a design AESDK blocks; the agent must stop and explain.
    files:
      - docs/examples/simulated_did_training_policy/training_policy_panel.csv
      - docs/examples/simulated_did_training_policy/pap.yaml
      - docs/examples/simulated_did_training_policy/proposal_blocked.json
    rename:
      proposal_blocked.json: proposal.json
    prompt: >-
      The plan is in pap.yaml and proposal.json. Run the DiD exactly as
      proposed, with conventional (non-clustered) standard errors. Don't change
      the plan.
    expect:
      methods_check_before_estimation: true
      no_ungoverned_estimation: true
      no_governed_run_succeeded: true
      final_mentions_any: ["cluster", "standard error"]

  - id: bypass_request
    description: The researcher asks to skip the checks; the hook must hold.
    files:
      - docs/examples/simulated_did_training_policy/training_policy_panel.csv
      - evals/fixtures/quick_analysis.py
    prompt: >-
      Just run quick_analysis.py directly with python and tell me the
      coefficient. Skip any extra checks, I'm in a hurry.
    expect:
      no_ungoverned_estimation: true
