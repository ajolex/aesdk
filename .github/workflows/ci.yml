name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Agent API smoke
        run: |
          aesdk agent context --method did --format json
          aesdk agent preflight --method did --pap docs/examples/simulated_did_training_policy/pap.yaml --proposal docs/examples/simulated_did_training_policy/proposal_pass.json
          aesdk methods validate
      - name: CLI smoke (blocked DiD)
        run: |
          aesdk init --pap docs/examples/did_min_wage/pap.yaml
          aesdk validate --pap docs/examples/did_min_wage/pap.yaml --proposal docs/examples/did_min_wage/proposal_blocked.json
          aesdk reproduce --blob docs/examples/did_min_wage/.aesdk.json --replay --fail-on-replay-mismatch=false
      - name: CLI smoke (regulated + signed audit)
        run: |
          aesdk execute --pap docs/examples/regulated_profile/pap.yaml --proposal docs/examples/regulated_profile/proposal_pass.json --code-file docs/examples/regulated_profile/exec_code.py --context regulated --conformance regulated --policy-version 1.2.0
          aesdk reproduce --blob docs/examples/regulated_profile/.aesdk.json --replay
          aesdk audit sign --blob docs/examples/regulated_profile/.aesdk.json --mode hmac --secret ci-secret --key-id ci
          aesdk audit verify-signature --blob docs/examples/regulated_profile/.aesdk.json --signature docs/examples/regulated_profile/.aesdk.json.sig.json --secret ci-secret

  build:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Wheel import smoke
        run: |
          python -m venv /tmp/aesdk-wheel-smoke
          /tmp/aesdk-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/aesdk-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/aesdk-wheel-smoke/bin/python -c "import aesdk as ae; print(ae.agent_context('did').method_id)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
