source:
  id: "AI_REPLICABILITY_GOVERNANCE"
  method_id: "cross_method"
  topic: "ai_replicability"
  rule_file_version: "1.0.0"
  organization: "cross_cutting_topic"
curriculum:
  stage: "research_reproducibility"
  topics:
    - "ai_assisted_research"
    - "replication"
rules:
  - id: AI-REP-001
    name: "AI Use Requires Declared Role"
    severity: "warning"
    estimators: []
    data_structures: []
    condition: "ai_used == true and text_missing(ai_role)"
    requirement: "AI-assisted research should declare what the AI system was used for."
    guidance: "State whether AI was used for code generation, text classification, data extraction, variable construction, literature summarization, or another role."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-002
    name: "AI-Dependent Results Must Be Reproducible Without Live AI"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and (ai_reproducible_without_ai != true or ai_live_model_required == true)"
    requirement: "The final analysis must be reproducible from archived code, data, prompts, outputs, and artifacts without requiring the same live AI model to be available later."
    guidance: "Archive the AI-generated code or outputs used in analysis. Do not make replication depend on re-querying a current model endpoint."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-003
    name: "AI Use Requires Prompt and Output Archives"
    severity: "warning"
    estimators: []
    data_structures: []
    condition: "ai_used == true and (ai_prompts_archived == false or ai_raw_outputs_archived == false)"
    requirement: "AI-assisted research should archive the prompts and raw model outputs that materially shaped the analysis."
    guidance: "Save prompt templates, user prompts, system/developer instructions when available, and raw model outputs or transcripts in the project folder or a controlled archive."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-007
    name: "Archived AI Prompts Require File Records"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_prompts_archived == true and ai_prompt_file_count == 0"
    requirement: "Declaring prompts archived requires at least one prompt file in ai_use.prompt_files."
    guidance: "Add the prompt template, prompt transcript, or archived conversation file to prompt_files so the passport can hash it."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-008
    name: "Archived AI Outputs Require File Records"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_raw_outputs_archived == true and ai_output_file_count == 0"
    requirement: "Declaring raw AI outputs archived requires at least one output file in ai_use.output_files."
    guidance: "Add raw model responses, JSONL classifications, extracted labels, or generated-code transcripts to output_files so the passport can hash them."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-004
    name: "AI-Derived Data Requires Raw Output Archive"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_output_used_as_data == true and ai_raw_outputs_archived == false"
    requirement: "If AI output is used as data, the raw AI outputs must be archived."
    guidance: "Archive the unedited AI classifications, extracted labels, text scores, or generated variables before downstream cleaning or analysis."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-005
    name: "AI-Derived Variables Require Human QA Plan"
    severity: "warning"
    estimators: []
    data_structures: []
    condition: "len(ai_derived_variables) > 0 and (ai_human_reviewed == false or text_missing(ai_qa_sample_plan))"
    requirement: "AI-derived variables should have human review or a documented quality-assurance sample plan."
    guidance: "Record the reviewed sample size, review criteria, adjudication process, and how disagreements or uncertain model outputs are handled."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-006
    name: "AI-Derived Data Requires Sensitivity Plan"
    severity: "warning"
    estimators: []
    data_structures: []
    condition: "ai_output_used_as_data == true and text_missing(ai_sensitivity_plan)"
    requirement: "Analyses using AI-derived data should document a sensitivity plan."
    guidance: "Check whether conclusions change under alternative classification thresholds, excluded uncertain cases, manually adjudicated labels, or a human-coded validation subset."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-009
    name: "AI-Derived Data Requires Named Variables"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_output_used_as_data == true and len(ai_derived_variables) == 0"
    requirement: "If AI output enters the analysis as data, the AI-derived variables must be named."
    guidance: "List each AI-derived variable, label, score, classification, or extracted field used downstream."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-010
    name: "AI-Derived Data Requires Input File Records"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_output_used_as_data == true and ai_input_file_count == 0"
    requirement: "AI-derived data workflows must list the input files sent to or processed by the AI system."
    guidance: "Add source text, documents, transcripts, images, or datasets to input_files so the passport can hash the AI input corpus."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-011
    name: "AI Code Generation Requires Code File Records"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and 'code_generation' in ai_roles and ai_code_file_count == 0"
    requirement: "If AI generated or materially revised analysis code, the final reviewable code file must be listed in ai_use.code_files."
    guidance: "Add every AI-generated or AI-revised analysis script, including Python `.py`, R `.R`, and Stata `.do` files, so the AI passport can hash the exact code that was checked, run, and archived."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-012
    name: "AI Code Generation Requires Declared Analysis Language"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and 'code_generation' in ai_roles and len(ai_languages) == 0"
    requirement: "If AI generated or materially revised analysis code, the analysis language must be declared."
    guidance: "Set ai_use.languages to the language used by the analysis code, such as `python`, `r`, `stata`, or `mixed`, so reviewers know which runtime and replication conventions apply."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-013
    name: "AI Code Generation Cannot Declare No Language"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and 'code_generation' in ai_roles and ai_code_language_has_none == true"
    requirement: "If AI generated or materially revised analysis code, the analysis language cannot be declared as `none`."
    guidance: "Use `python`, `r`, `stata`, or `mixed` for AI-written analysis code. Reserve `none` for AI use that did not produce or revise analysis code."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-014
    name: "AI Code Language Must Match Archived Code Files"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and 'code_generation' in ai_roles and ai_code_language_mismatch == true"
    requirement: "The declared AI code language must match the archived code files."
    guidance: "If `code_files` contains Stata `.do`, R `.R`, or Python `.py` scripts, declare the same languages in `ai_use.languages`, or use `mixed` when the workflow genuinely spans multiple languages."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-015
    name: "AI Model Field Cannot Be A Coding Agent Tool"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_model_looks_like_agent_tool == true"
    requirement: "The AI model field must name the underlying model, not the coding agent or editor."
    guidance: "Record tools such as Codex, Claude Code, GitHub Copilot, VS Code, OpenCode, Cursor, or Windsurf in `ai_use.agent_tool`. Put the model name in `ai_use.model` only when the tool or API discloses it."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-016
    name: "AI Model Metadata Requires Model Or Unavailable Reason"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and text_missing(ai_model) and text_missing(ai_model_metadata_unavailable_reason)"
    requirement: "AI-use metadata must either record the underlying model or explain why the model metadata is unavailable."
    guidance: "For API calls, archive the model id from the response. For coding agents that do not expose the underlying model, set `model_metadata_source: agent_unavailable` and explain the limitation in `model_metadata_unavailable_reason`."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-020
    name: "AI Model Metadata Source Required"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and text_missing(ai_model_metadata_source)"
    requirement: "AI-use metadata must state where the model metadata came from."
    guidance: "Use `api_response` for direct API metadata, `agent_reported` when the agent surface reports the model, `user_reported` when a researcher supplies it, or `agent_unavailable` when the coding agent does not expose the model id."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-017
    name: "Unavailable Model Metadata Requires Explicit Source"
    severity: "warning"
    estimators: []
    data_structures: []
    condition: "ai_used == true and not text_missing(ai_model_metadata_unavailable_reason) and ai_model_metadata_source != 'agent_unavailable'"
    requirement: "When model metadata is unavailable, the metadata source should say so explicitly."
    guidance: "Set `model_metadata_source: agent_unavailable` when using a coding agent that does not disclose the exact underlying model in the project artifacts."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-018
    name: "Human Review Claim Requires Review Evidence"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_human_reviewed == true and (ai_review_status is None or ai_review_status == 'not_reviewed' or ai_review_file_count == 0 or ai_review_file_missing_count > 0 or ai_review_file_trivial_count > 0)"
    requirement: "A true human-review claim must include review status and at least one existing non-empty review evidence file."
    guidance: "Use `review_status`, `reviewer_role`, and `review_files` to record who reviewed the AI-assisted work and what evidence documents that review. Do not set `human_reviewed: true` for an agent-only run."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-019
    name: "Unavailable Agent Model Metadata Requires Runtime Snapshot"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_model_metadata_source == 'agent_unavailable' and (ai_runtime_metadata_file_count == 0 or ai_runtime_metadata_file_missing_count > 0)"
    requirement: "If a coding agent cannot expose the underlying model id, the project must archive an existing runtime metadata snapshot."
    guidance: "Run `aesdk agent codex-runtime --output codex_runtime.json` or archive an equivalent tool/runtime metadata file, then list it in `ai_use.runtime_metadata_files`."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-021
    name: "Unavailable Agent Model Metadata Requires Agent Tool"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_model_metadata_source == 'agent_unavailable' and text_missing(ai_agent_tool)"
    requirement: "When model metadata is unavailable because of a coding agent, the agent tool must be named."
    guidance: "Record the coding agent or editor in `ai_use.agent_tool`, for example Codex, Claude Code, GitHub Copilot in VS Code, OpenCode, Cursor, or Windsurf."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-022
    name: "Human In Loop Claim Requires Interaction Evidence"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_human_in_loop == true and (ai_human_interaction_file_count == 0 or ai_human_interaction_file_missing_count > 0 or ai_human_interaction_file_trivial_count > 0)"
    requirement: "A human-in-the-loop claim must include at least one existing non-empty interaction evidence file."
    guidance: "Archive follow-up questions, clarification transcripts, review comments, or agent conversation exports in `ai_use.human_interaction_files`. This documents interaction, not final review approval."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-023
    name: "Human Code Intervention Requires Change Evidence"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_human_modified_code == true and (ai_human_intervention_file_count == 0 or ai_human_intervention_file_missing_count > 0 or ai_human_intervention_file_trivial_count > 0)"
    requirement: "A human code-intervention claim must include an existing non-empty diff, patch, or manual-change note."
    guidance: "Use `aesdk agent review-diff --ai-code <draft> --final-code <final> --output review/human_code_diff.patch`, or archive a manual-change note in `ai_use.human_intervention_files`."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-025
    name: "Human Code Intervention Must Show A Code Change"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_human_modified_code == true and ai_human_intervention_no_change_file_count > 0"
    requirement: "A human code-intervention claim cannot rely on a no-change diff."
    guidance: "If the final code is identical to the AI draft, set `human_modified_code: false`. Keep `human_in_loop` or `human_reviewed` evidence separately when applicable."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026

  - id: AI-REP-024
    name: "Human Code Intervention Must Archive AI Draft"
    severity: "error"
    estimators: []
    data_structures: []
    condition: "ai_used == true and ai_human_modified_code == true and (ai_code_draft_file_count == 0 or ai_code_draft_file_missing_count > 0)"
    requirement: "When human code changes are documented, the AI-generated draft must also be archived."
    guidance: "List the original AI-generated code draft in `ai_use.ai_code_draft_files` so reviewers can compare the AI draft, human edits, and final analysis script."
    reference:
      authors: "AESDK"
      title: "AI Replicability Passport"
      year: 2026
