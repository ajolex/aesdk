source:
  id: "IV_2SLS_GOVERNANCE"
  method_id: "iv_2sls"
  topic: "instrumental_variables"
  rule_file_version: "1.1.0"
  organization: "method_topic"
curriculum:
  stage: "identification_pivot"
  topics:
    - "iv_2sls"
    - "simultaneous_equations"
rules:
  - id: W-IV-001
    name: "IV Requires Registered Excluded Instruments"
    severity: "error"
    estimators: ["IV", "2SLS"]
    data_structures: ["cross-section", "pooled", "panel"]
    condition: "len(iv_instruments) == 0"
    requirement: "An IV design must register at least one excluded instrument before estimation."
    guidance: "Declare the instrument list in iv_block.instruments and document why each instrument is relevant and excluded from the structural outcome equation."
    reference:
      authors: "Wooldridge, Jeffrey M."
      book: "Econometric Analysis of Cross Section and Panel Data"
      chapter: 5
      title: "Instrumental Variables Estimation of Single-Equation Linear Models"
  - id: W-IV-002
    name: "Weak First Stage Blocks IV Execution"
    severity: "error"
    estimators: ["IV", "2SLS"]
    data_structures: ["cross-section", "pooled", "panel"]
    condition: "first_stage_f_stat is not None and first_stage_f_stat < first_stage_f_threshold"
    requirement: "The reported first-stage strength is below the registered threshold."
    guidance: "Revisit the instrument set, use weak-instrument robust inference, or revise the design before reporting IV estimates."
    reference:
      authors: "Wooldridge, Jeffrey M."
      book: "Econometric Analysis of Cross Section and Panel Data"
      chapter: 5
      title: "Instrumental Variables and Two-Stage Least Squares"
  - id: W-IV-003
    name: "First Stage Evidence Required for IV"
    severity: "warning"
    estimators: ["IV", "2SLS"]
    data_structures: ["cross-section", "pooled", "panel"]
    condition: "first_stage_f_stat is None"
    requirement: "The IV proposal does not report first-stage evidence."
    guidance: "Report the first-stage statistic or another registered relevance diagnostic before interpreting 2SLS results."
    reference:
      authors: "Wooldridge, Jeffrey M."
      book: "Econometric Analysis of Cross Section and Panel Data"
      chapter: 5
      title: "Instrumental Variables and Two-Stage Least Squares"
  - id: W-IV-004
    name: "IV Requires Exclusion Restriction Argument"
    severity: "error"
    estimators: ["IV", "2SLS"]
    data_structures: ["cross-section", "pooled", "panel"]
    condition: "exclusion_restriction_documented == false"
    requirement: "An IV design must document why excluded instruments affect the outcome only through the endogenous variable."
    guidance: "Write the substantive exclusion restriction argument for each excluded instrument before estimating 2SLS."
    reference:
      authors: "Wooldridge, Jeffrey M.; Angrist, Joshua D.; Pischke, Jorn-Steffen"
      title: "Instrument relevance and exclusion restrictions"
