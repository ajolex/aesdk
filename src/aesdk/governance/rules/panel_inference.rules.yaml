source:
  id: "PANEL_INFERENCE_GOVERNANCE"
  method_id: "panel_fe"
  topic: "panel_inference"
  rule_file_version: "1.1.0"
  organization: "method_topic"
curriculum:
  stage: "theoretical_microfoundations"
  topics:
    - "panel_data"
rules:
  - id: W-PANEL-001
    name: "Cluster SE Required for Panel Data"
    severity: "error"
    estimators: ["OLS", "FE", "RE", "POLS", "TWFE", "DiD"]
    data_structures: ["panel"]
    condition: "data_structure == 'panel' and standard_errors not in ['cluster', 'robust-cluster', 'two-way-cluster', 'driscoll-kraay', 'wild-cluster-bootstrap']"
    requirement: "Panel designs must use clustered standard errors or stronger alternatives."
    guidance: "Cluster at the unit of repeated observation or treatment assignment level."
    reference:
      authors: "Wooldridge, Jeffrey M."
      book: "Econometric Analysis of Cross Section and Panel Data"
      chapter: 7
      section: "7.8"
      title: "Cluster-Sample Methods"
  - id: W-PANEL-002
    name: "Cluster Level Must Not Be Below Treatment Assignment Level"
    severity: "error"
    estimators: ["OLS", "FE", "RE", "POLS", "TWFE", "DiD", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "treatment_assignment_level is not None and clustering_level is not None and cluster_hierarchy_rank(clustering_level) < cluster_hierarchy_rank(treatment_assignment_level)"
    requirement: "Clustered inference must be at least as aggregated as the treatment assignment level when that level is known."
    guidance: "Cluster at the assignment level or a more aggregated level; for uncertain designs, use a conservative clustering strategy."
    reference:
      authors: "Wooldridge, Jeffrey M."
      book: "Econometric Analysis of Cross Section and Panel Data"
      chapter: 7
      section: "7.8"
      title: "Cluster-Sample Methods"
  - id: W-PANEL-003
    name: "Clustered Inference Requires Declared Cluster Level"
    severity: "error"
    estimators: ["OLS", "FE", "RE", "POLS", "TWFE", "DiD", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "standard_errors in ['cluster', 'robust-cluster', 'two-way-cluster', 'wild-cluster-bootstrap'] and cluster_level_missing(clustering_level)"
    requirement: "Clustered inference must declare the clustering level or cluster dimensions."
    guidance: "Name the cluster level, such as unit, state, school, or county; for multiway clustering, name each dimension explicitly."
    reference:
      authors: "Wooldridge, Jeffrey M."
      book: "Econometric Analysis of Cross Section and Panel Data"
      chapter: 7
      section: "7.8"
      title: "Cluster-Sample Methods"
  - id: W-PANEL-004
    name: "Two-Way Cluster Requires Two Declared Dimensions"
    severity: "error"
    estimators: ["OLS", "FE", "RE", "POLS", "TWFE", "DiD", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "standard_errors == 'two-way-cluster' and cluster_level_count(clustering_level) < 2"
    requirement: "Two-way clustered inference must declare two clustering dimensions."
    guidance: "Declare both dimensions, for example ['state', 'year'] or 'state year', so reviewers can assess the intended dependence structure."
    reference:
      authors: "Wooldridge, Jeffrey M."
      book: "Econometric Analysis of Cross Section and Panel Data"
      chapter: 7
      section: "7.8"
      title: "Cluster-Sample Methods"
  - id: PANEL-FE-005
    name: "Panel FE Requires Unit and Time Index"
    severity: "error"
    estimators: ["FE", "RE", "POLS"]
    data_structures: ["panel"]
    condition: "panel_unit is None or panel_unit == '' or panel_time is None or panel_time == ''"
    requirement: "Panel workflows must declare both the unit index and time index."
    guidance: "Record the panel unit and time variables before estimating fixed, random, or pooled panel models."
    reference:
      authors: "Wooldridge, Jeffrey M.; Verbeek, Marno"
      title: "Panel data structure"
  - id: PANEL-FE-006
    name: "Fixed Effects Require Declared Effects"
    severity: "error"
    estimators: ["FE"]
    data_structures: ["panel"]
    condition: "len(fixed_effects) == 0"
    requirement: "Fixed-effects workflows must declare the fixed effects included in the model."
    guidance: "State unit, time, two-way, or other fixed effects and how they match the estimand."
    reference:
      authors: "Wooldridge, Jeffrey M.; Verbeek, Marno"
      title: "Fixed effects and within estimation"
  - id: PANEL-FE-007
    name: "Fixed Effects Require Within-Variation Explanation"
    severity: "warning"
    estimators: ["FE"]
    data_structures: ["panel"]
    condition: "within_variation_documented != true"
    requirement: "Fixed-effects workflows should explain the remaining within-unit identifying variation."
    guidance: "Describe the within-unit changes that identify the coefficient after fixed effects."
    reference:
      authors: "Wooldridge, Jeffrey M.; Verbeek, Marno"
      title: "Within-estimation interpretation"
  - id: PANEL-FE-008
    name: "Unit FE Cannot Identify Time-Invariant Regressors"
    severity: "error"
    estimators: ["FE"]
    data_structures: ["panel"]
    condition: "'unit' in fixed_effects and len(time_invariant_regressors) > 0 and time_invariant_interpreted == true"
    requirement: "Unit fixed effects absorb time-invariant regressors; those coefficients cannot be interpreted as identified by the FE model."
    guidance: "Remove the interpretation, use a different design, or explain a model that can identify time-invariant variables."
    reference:
      authors: "Wooldridge, Jeffrey M.; Verbeek, Marno"
      title: "Time-invariant regressors under unit fixed effects"
