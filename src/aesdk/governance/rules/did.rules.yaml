source:
  id: "DID_GOVERNANCE"
  method_id: "did"
  topic: "difference_in_differences"
  rule_file_version: "1.1.0"
  organization: "method_topic"
curriculum:
  stage: "advanced_empirical_research"
  topics:
    - "potential_outcomes"
    - "did_staggered"
rules:
  - id: AP-DID-001
    name: "DiD Requires Parallel-Trends Diagnostic"
    severity: "warning"
    estimators: ["DiD", "TWFE", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "identification_strategy in ['DiD', 'TWFE', 'EventStudy'] and parallel_trends_test == false"
    requirement: "A DiD design must register a parallel-trends diagnostic or a design-specific substitute."
    guidance: "Use pre-treatment event-study leads, graphical diagnostics, or a registered falsification design before interpreting DiD causally."
    reference:
      authors: "Angrist, Joshua D.; Pischke, Jorn-Steffen"
      book: "Mostly Harmless Econometrics"
      chapter: 5
      title: "Fixed Effects, Differences-in-Differences, and Panel Data"
  - id: AP-DID-002
    name: "DiD Event-Study Window Should Be Registered"
    severity: "warning"
    estimators: ["DiD", "TWFE", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "identification_strategy in ['DiD', 'TWFE', 'EventStudy'] and (event_study_leads_lags is None or len(event_study_leads_lags) == 0)"
    requirement: "The PAP does not register event-study leads/lags for diagnosing pre-trends and dynamic treatment effects."
    guidance: "Register the event-time window or explain why an event-study diagnostic is not appropriate for the design."
    reference:
      authors: "Angrist, Joshua D.; Pischke, Jorn-Steffen"
      book: "Mostly Harmless Econometrics"
      chapter: 5
      title: "Fixed Effects, Differences-in-Differences, and Panel Data"

  - id: AP-DID-003
    name: "Staggered Adoption Requires Modern DiD Estimator"
    severity: "error"
    estimators: ["TWFE", "DiD", "EventStudy"]
    data_structures: ["panel"]
    condition: "identification_strategy in ['DiD', 'TWFE', 'EventStudy'] and staggered_adoption == true and estimator == 'TWFE' and twfe_prescribed_by_task != true"
    requirement: "Staggered adoption with TWFE is blocked due to known weighting bias."
    guidance: "Use Callaway-Sant'Anna, Sun-Abraham interactions, or stacked DiD."
    reference:
      authors: "Callaway & Sant'Anna"
      journal: "Journal of Econometrics"
      year: 2021
      title: "Difference-in-Differences with Multiple Time Periods"
  - id: AP-DID-006
    name: "Task-Prescribed TWFE Must Be Labeled As Pedagogical Or Descriptive"
    severity: "warning"
    strict_escalates: false
    estimators: ["TWFE"]
    data_structures: ["panel"]
    condition: "identification_strategy in ['DiD', 'TWFE', 'EventStudy'] and staggered_adoption == true and estimator == 'TWFE' and twfe_prescribed_by_task == true"
    requirement: "If a task explicitly requires TWFE for staggered adoption, AESDK allows the run only as a task-prescribed specification, not as an unqualified modern causal estimator."
    guidance: "State that TWFE is required by the assignment or researcher instruction, preserve the task instruction in the archive, and avoid claiming it resolves staggered-treatment weighting concerns unless a modern DiD robustness design is also registered."
    reference:
      authors: "Callaway & Sant'Anna"
      journal: "Journal of Econometrics"
      year: 2021
      title: "Difference-in-Differences with Multiple Time Periods"
  - id: AP-DID-004
    name: "DiD Requires Comparison Group Justification"
    severity: "error"
    estimators: ["DiD", "TWFE", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "identification_strategy in ['DiD', 'TWFE', 'EventStudy'] and (control_group is None or control_group_justification is None or control_group_justification == '')"
    requirement: "A DiD design must define and justify the comparison group before estimation."
    guidance: "Declare whether controls are never-treated, not-yet-treated, matched, or another registered group, and explain why they support the identifying contrast."
    reference:
      authors: "Angrist, Joshua D.; Pischke, Jorn-Steffen"
      book: "Mostly Harmless Econometrics"
      chapter: 5
      title: "Fixed Effects, Differences-in-Differences, and Panel Data"
  - id: AP-DID-007
    name: "Pre-Trends Are Low-Powered; Register A Sensitivity Analysis"
    severity: "info"
    estimators: ["DiD", "TWFE", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "identification_strategy in ['DiD', 'TWFE', 'EventStudy'] and sensitivity_analysis != true"
    requirement: "A parallel-trends pre-test is not the identifying assumption and is often underpowered; register a sensitivity analysis to violations of parallel trends."
    guidance: "Do not rely on a non-significant pre-trend test to establish parallel trends. Register a sensitivity analysis that bounds post-treatment violations by the pre-treatment trend (Rambachan & Sant'Anna honest DiD), and report the breakdown point."
    reference:
      authors: "Rambachan, Ashesh; Roth, Jonathan"
      journal: "Review of Economic Studies"
      year: 2023
      title: "A More Credible Approach to Parallel Trends"
  - id: AP-DID-008
    name: "Parallel Trends Is Functional-Form Dependent"
    severity: "info"
    estimators: ["DiD", "TWFE", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "identification_strategy in ['DiD', 'TWFE', 'EventStudy'] and text_missing(parallel_trends_transformation)"
    requirement: "Parallel trends generally holds for at most one transformation of the outcome, so the outcome scale must be declared."
    guidance: "State the outcome transformation (levels, logs, or other) in which parallel trends is assumed, and justify it; parallel trends in levels and in logs are different assumptions. Consider the Roth-Sant'Anna falsification test for insensitivity to functional form."
    reference:
      authors: "Roth, Jonathan; Sant'Anna, Pedro H. C."
      journal: "Econometrica"
      year: 2023
      title: "When Is Parallel Trends Sensitive to Functional Form?"
  - id: AP-DID-009
    name: "No-Anticipation Assumption Must Be Addressed"
    severity: "info"
    estimators: ["DiD", "TWFE", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "identification_strategy in ['DiD', 'TWFE', 'EventStudy'] and no_anticipation != true"
    requirement: "DiD requires a no-anticipation assumption so pre-treatment outcomes reflect untreated potential outcomes."
    guidance: "Confirm units do not respond before treatment (no anticipation), or model an explicit anticipation window. Announcement effects before implementation violate the standard estimand."
    reference:
      authors: "Roth, Jonathan; Sant'Anna, Pedro H. C.; Bilinski, Alyssa; Poe, John"
      journal: "Journal of Econometrics"
      year: 2023
      title: "What's Trending in Difference-in-Differences?"
  - id: AP-DID-010
    name: "Conditional Parallel Trends Needs Doubly-Robust Covariate Adjustment"
    severity: "warning"
    estimators: ["DiD", "TWFE", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "covariate_adjustment == 'twfe_covariates'"
    requirement: "When covariates are needed for conditional parallel trends, including them linearly in a TWFE regression does not generally recover the ATT."
    guidance: "Use regression adjustment, inverse-propensity weighting, or a doubly-robust estimator (Sant'Anna & Zhao 2020; Callaway & Sant'Anna 2021) rather than adding covariates to a TWFE specification, whose weighting can be misleading (Caetano & Callaway 2024)."
    reference:
      authors: "Sant'Anna, Pedro H. C.; Zhao, Jun"
      journal: "Journal of Econometrics"
      year: 2020
      title: "Doubly Robust Difference-in-Differences Estimators"
  - id: AP-DID-005
    name: "Randomized-Design DiD Requires Provenance Note"
    severity: "warning"
    estimators: ["DiD", "TWFE", "EventStudy"]
    data_structures: ["panel", "pooled"]
    condition: "design_origin == 'experimental_rct' and text_missing(design_note)"
    requirement: "A DiD analysis that comes from randomized assignment or rollout should say so explicitly."
    guidance: "Document what was randomized, why a DiD/event-study estimator is being used, and which experimental assumptions or spillover risks remain relevant."
    reference:
      authors: "Angrist, Joshua D.; Pischke, Jorn-Steffen"
      book: "Mostly Harmless Econometrics"
      chapter: 5
      title: "Fixed Effects, Differences-in-Differences, and Panel Data"
