version: "0.1.0"
extraction:
  method: "PyMuPDF text search over local PDFs, followed by compact paraphrased SDK protocol creation."
  note: "PDF page numbers are 1-based document pages from the local files, not printed book page numbers."
method_sources:
  ols_cef:
    - source_id: "wooldridge_cross_section_panel"
      local_path: "tools/Wooldridge.pdf"
      locators:
        - pdf_pages: [253]
          topic: "heteroskedasticity-robust inference"
        - pdf_pages: [1, 2, 3, 4, 5]
          topic: "econometrics, causal questions, and data structures"
      sdk_context:
        - "Use regression as a conditional mean/structural modeling tool only after stating the estimand and identification conditions."
        - "Use robust or clustered inference when sampling or assignment makes conventional standard errors unreliable."
    - source_id: "angrist_pischke_mhe"
      local_path: "tools/MostlyHarmlessEconometrics.pdf"
      locators:
        - pdf_pages: [37, 38, 40, 42]
          topic: "Making Regression Make Sense"
      sdk_context:
        - "Frame regression around the conditional expectation function and the identifying comparison."
  iv_2sls:
    - source_id: "wooldridge_cross_section_panel"
      local_path: "tools/Wooldridge.pdf"
      locators:
        - pdf_pages: [466, 468, 470, 472, 474]
          topic: "instrumental variables estimation"
      sdk_context:
        - "Require excluded instruments, relevance evidence, and an exclusion restriction argument before IV execution."
    - source_id: "angrist_pischke_mhe"
      local_path: "tools/MostlyHarmlessEconometrics.pdf"
      locators:
        - pdf_pages: [100, 101, 103, 105]
          topic: "IV and causality"
      sdk_context:
        - "Interpret IV carefully under treatment effect heterogeneity, including LATE-style framing where appropriate."
  panel_fe:
    - source_id: "wooldridge_cross_section_panel"
      local_path: "tools/Wooldridge.pdf"
      locators:
        - pdf_pages: [424, 438, 446, 447, 448]
          topic: "fixed effects and unobserved effects"
        - pdf_pages: [460, 774, 809]
          topic: "panel data models"
      sdk_context:
        - "Panel methods must declare unit/time structure and the identifying within-unit or between-unit variation."
        - "Inference must address repeated observations, clustering, serial correlation, and heteroskedasticity."
    - source_id: "angrist_pischke_mhe"
      local_path: "tools/MostlyHarmlessEconometrics.pdf"
      locators:
        - pdf_pages: [181]
          topic: "Parallel Worlds: fixed effects, differences-in-differences, and panel data"
      sdk_context:
        - "Use fixed effects as a design tool whose identifying variation must be explained, not as automatic causal magic."
  did:
    - source_id: "angrist_pischke_mhe"
      local_path: "tools/MostlyHarmlessEconometrics.pdf"
      locators:
        - pdf_pages: [181]
          topic: "fixed effects, differences-in-differences, and panel data"
        - pdf_pages: [185, 187, 189, 191, 193]
          topic: "differences-in-differences examples and diagnostics"
        - pdf_pages: [238, 247, 249, 251]
          topic: "clustering and serial correlation in panels"
      sdk_context:
        - "A DiD workflow must register the comparison group, treatment timing, pre-trend diagnostic, and clustered inference plan."
        - "Serial correlation and grouped treatment assignment are first-order inference risks in panel DiD."
    - source_id: "callaway_santanna_2021"
      locators:
        - topic: "multiple-period DiD with staggered treatment timing"
      sdk_context:
        - "Plain TWFE is blocked for staggered adoption unless a modern estimator or decomposition strategy is registered."
  rdd:
    - source_id: "angrist_pischke_mhe"
      local_path: "tools/MostlyHarmlessEconometrics.pdf"
      locators:
        - pdf_pages: [205, 206]
          topic: "regression discontinuity designs"
      sdk_context:
        - "Future RDD protocol should require running variable, cutoff, bandwidth, continuity assumptions, and manipulation checks."
  matching:
    - source_id: "world_bank_impact_eval"
      local_path: "tools/WorldBankImpactEval.pdf"
      locators:
        - pdf_pages: [173, 174, 175]
          topic: "matching and propensity-score design"
      sdk_context:
        - "Matching workflows must register pre-treatment covariates, balance diagnostics, and common-support checks."
    - source_id: "angrist_pischke_mhe"
      local_path: "tools/MostlyHarmlessEconometrics.pdf"
      locators:
        - pdf_pages: [30, 32, 34, 38, 58]
          topic: "selection, matching logic, and regression design comparisons"
      sdk_context:
        - "Matching is a design/preprocessing step; it does not solve unobserved confounding without a credible assumption."
  experimental_rct:
    - source_id: "jpal_randomization"
      locators:
        - topic: "randomization, ATE intuition, assignment unit, strata, and replicable assignment"
      sdk_context:
        - "RCT workflows must document randomization unit, assignment variable, treatment arms, and assignment probabilities."
        - "Stratified or clustered assignment must be reflected in the analysis and inference plan."
    - source_id: "jpal_data_analysis"
      locators:
        - topic: "ATE, LATE, treatment-on-treated, attrition, spillovers, and randomization inference"
      sdk_context:
        - "Agents must distinguish ITT/ATE/ATT/LATE and check compliance, attrition, spillovers, and randomization-inference options."
    - source_id: "bedecarrats_guerin_roubaud_2015"
      local_path: "tools/2015-01-EN-The-gold-standard-for-randomized-evaluations-from-discussion-of-method-to-political-economy.pdf"
      locators:
        - pdf_pages: [1, 2, 3]
          topic: "RCT scope and political-economy cautions"
      sdk_context:
        - "Do not treat RCTs as a universal gold standard; require scope, implementation, and external-validity discussion."
  synthetic_control:
    - source_id: "world_bank_impact_eval"
      local_path: "tools/WorldBankImpactEval.pdf"
      locators:
        - pdf_pages: [167, 168, 169, 174, 178]
          topic: "synthetic control in impact evaluation"
      sdk_context:
        - "Synthetic-control workflows must define the treated unit, donor pool, intervention time, pre-treatment fit, and placebo strategy."
    - source_id: "abadie_diamond_hainmueller_2010"
      locators:
        - topic: "synthetic control methods for comparative case studies"
      sdk_context:
        - "A weighted donor pool should reproduce treated-unit pre-treatment outcomes or predictors before post-treatment effects are interpreted."
  nonlinear_did:
    - source_id: "wooldridge_nonlinear_did_2023"
      local_path: "tools/utad016.pdf"
      locators:
        - pdf_pages: [1, 2, 3, 12, 14, 17, 21, 22]
          topic: "nonlinear DiD with panel data"
      sdk_context:
        - "Nonlinear DiD must declare the target scale and avoid treating nonlinear model coefficients as automatic treatment effects."
    - source_id: "callaway_santanna_2021"
      locators:
        - topic: "staggered DiD estimands and group-time effects"
      sdk_context:
        - "Nonlinear extensions still need clear timing, comparison-group, and aggregation choices."
  gmm:
    - source_id: "greene_econometric_analysis"
      local_path: "tools/econometric_analysis_by_greence.pdf"
      locators:
        - pdf_pages: [3, 9, 10, 11, 12, 14, 22, 31]
          topic: "GMM and advanced econometric estimation"
      sdk_context:
        - "GMM workflows must register moment conditions, parameters, instruments, identification rank, and weighting matrix."
    - source_id: "hansen_1982"
      locators:
        - topic: "large sample properties of GMM estimators"
      sdk_context:
        - "Overidentifying restrictions are diagnostics for the moment set, not proof that the substantive model is true."
  limited_dependent:
    - source_id: "greene_econometric_analysis"
      local_path: "tools/econometric_analysis_by_greence.pdf"
      locators:
        - pdf_pages: [179, 211, 212, 214, 450]
          topic: "limited dependent variable and nonlinear models"
      sdk_context:
        - "Limited dependent variable workflows must declare outcome support, link/family, target effect, and marginal-effect interpretation."
    - source_id: "wooldridge_cross_section_panel"
      local_path: "tools/Wooldridge.pdf"
      locators:
        - pdf_pages: [534, 535, 536, 537, 538, 539]
          topic: "binary response and nonlinear panel/cross-section models"
      sdk_context:
        - "Nonlinear model coefficients usually need transformation before they are reported as substantive effects."
  time_series:
    - source_id: "stock_watson_intro_econometrics"
      local_path: "tools/JamesHStock.pdf"
      locators:
        - pdf_pages: [17, 18, 19, 23, 24, 32, 38]
          topic: "time-series regression and forecasting"
      sdk_context:
        - "Time-series workflows must declare time index, frequency, stationarity plan, lag order, and forecast or causal target."
    - source_id: "greene_econometric_analysis"
      local_path: "tools/econometric_analysis_by_greence.pdf"
      locators:
        - pdf_pages: [3, 9, 10, 14, 15, 23, 24, 30]
          topic: "time-series econometrics"
      sdk_context:
        - "Serial dependence and nonstationarity are first-order design risks, not afterthought diagnostics."
