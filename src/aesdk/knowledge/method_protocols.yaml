version: "0.1.0"
methods:
  ols_cef:
    name: "OLS / CEF Regression"
    status: "initial"
    curriculum:
      stage: "foundations_mechanics"
      topics:
        - "simple_linear_regression"
        - "gauss_markov"
        - "multiple_regression_ovb"
        - "inference"
        - "functional_forms"
    data_structures: ["cross-section", "pooled", "panel"]
    estimators: ["OLS"]
    purpose: "Estimate conditional mean relationships and, under stated identification assumptions, causal parameters."
    assumptions:
      - "The target estimand is stated before estimation."
      - "The identifying variation is conditionally exogenous given the registered covariates or design."
      - "The functional form and included covariates are part of the pre-analysis plan."
      - "Inference is robust to plausible heteroskedasticity or clustering in the design."
    required_pap_fields:
      - "identification.strategy"
      - "identification.treatment_variable"
      - "identification.outcome_variable"
      - "identification.covariates"
      - "identification.standard_errors"
      - "robustness.specification_curve"
    diagnostics:
      - "Inspect covariate balance or design support where causal language is used."
      - "Use heteroskedasticity-robust inference unless conventional inference is explicitly justified."
      - "For grouped, repeated, or assigned-at-group designs, cluster at the assignment or sampling level."
    blocks_or_warnings:
      - "Block causal claims if the exogeneity/design assumption is not documented."
      - "Warn when conventional standard errors are used without justification."
      - "Block post-hoc covariate selection that is not declared in the PAP."
    sources:
      - {id: "wooldridge_intro_modern", chapters: ["1", "2", "3", "4"]}
      - {id: "stock_watson_intro_econometrics"}
      - {id: "wooldridge_cross_section_panel", chapters: ["4"]}
      - {id: "angrist_pischke_mhe", chapters: ["3"]}
  iv_2sls:
    name: "Instrumental Variables / 2SLS"
    status: "initial"
    curriculum:
      stage: "identification_pivot"
      topics:
        - "iv_2sls"
        - "simultaneous_equations"
        - "heteroskedasticity_robust_se"
    data_structures: ["cross-section", "pooled", "panel"]
    estimators: ["IV", "2SLS"]
    purpose: "Estimate causal effects when treatment or exposure is endogenous and valid excluded instruments are available."
    assumptions:
      - "Excluded instruments are relevant for the endogenous variable."
      - "Excluded instruments affect the outcome only through the endogenous variable."
      - "Excluded instruments are independent of unobserved determinants of the outcome under the design."
      - "The estimand is interpreted carefully when effects are heterogeneous."
    required_pap_fields:
      - "iv_block.instruments"
      - "iv_block.first_stage_f_threshold"
      - "identification.treatment_variable"
      - "identification.outcome_variable"
      - "identification.covariates"
    diagnostics:
      - "Report first-stage strength for excluded instruments."
      - "Use heteroskedasticity-robust or cluster-robust 2SLS inference as appropriate."
      - "When overidentified, report and interpret overidentification checks as diagnostics rather than proof of validity."
      - "Document the substantive exclusion restriction argument."
    blocks_or_warnings:
      - "Block IV execution when no excluded instrument is registered."
      - "Block or warn when the reported first-stage statistic is below the registered threshold."
      - "Warn when first-stage evidence is missing."
    sources:
      - {id: "wooldridge_cross_section_panel", chapters: ["5"]}
      - {id: "angrist_pischke_mhe", chapters: ["4"]}
  panel_fe:
    name: "Panel Fixed Effects / Unobserved Effects"
    status: "initial"
    curriculum:
      stage: "theoretical_microfoundations"
      topics:
        - "panel_data"
        - "matrix_ols"
        - "asymptotic_theory"
    data_structures: ["panel"]
    estimators: ["FE", "TWFE", "POLS", "RE"]
    purpose: "Use repeated observations to control for time-invariant unobserved heterogeneity or model panel dependence."
    assumptions:
      - "The panel unit and time index are declared."
      - "The source of identifying variation after fixed effects is described."
      - "Serial correlation, heteroskedasticity, and clustering are addressed in inference."
      - "Time-invariant regressors are not interpreted as identified by unit fixed effects."
    required_pap_fields:
      - "data.unit"
      - "data.structure"
      - "data.N"
      - "data.T"
      - "identification.fixed_effects"
      - "identification.standard_errors"
      - "identification.clustering"
    diagnostics:
      - "Cluster at the repeated-observation unit or treatment assignment level."
      - "Consider serial correlation diagnostics for longer panels."
      - "Document whether fixed effects, random effects, or pooled models match the estimand."
    blocks_or_warnings:
      - "Block panel workflows using conventional or only HC standard errors when clustered inference is required."
      - "Block clustering below the treatment assignment level when that level is known."
      - "Warn when fixed-effects identification is claimed but the remaining within-unit variation is not described."
    sources:
      - {id: "wooldridge_cross_section_panel", chapters: ["10", "11"]}
      - {id: "angrist_pischke_mhe", chapters: ["5"]}
  did:
    name: "Differences-in-Differences"
    status: "initial"
    curriculum:
      stage: "advanced_empirical_research"
      topics:
        - "potential_outcomes"
        - "did_staggered"
    data_structures: ["panel", "pooled"]
    estimators: ["DiD", "TWFE", "EventStudy"]
    purpose: "Estimate treatment effects by comparing outcome changes between treated and comparison groups under a parallel-trends design."
    assumptions:
      - "A credible comparison group is defined before estimation."
      - "Parallel trends or a design-specific substitute is argued and diagnosed."
      - "Treatment timing, anticipation, and dynamic effects are documented."
      - "Inference accounts for clustering and serial correlation in grouped or panel treatment designs."
    required_pap_fields:
      - "did_block.parallel_trends_test"
      - "did_block.event_study_leads_lags"
      - "did_block.staggered_adoption"
      - "did_block.control_group"
      - "did_block.control_group_justification"
      - "identification.standard_errors"
      - "identification.clustering"
    diagnostics:
      - "Report pre-treatment event-study leads or another registered pre-trend diagnostic."
      - "Document the comparison group for staggered adoption."
      - "Avoid plain TWFE as the default estimator when treatment timing is staggered."
      - "Use placebo or falsification checks when registered."
    blocks_or_warnings:
      - "Block staggered-adoption TWFE unless a modern estimator or decomposition strategy is registered."
      - "Block DiD without clustered or stronger inference for panel/grouped designs."
      - "Block missing comparison-group justification."
      - "Warn when pre-trend diagnostics are missing."
    sources:
      - {id: "angrist_pischke_mhe", chapters: ["5", "8"]}
      - {id: "callaway_santanna_2021"}
  rdd:
    name: "Regression Discontinuity Design"
    status: "planned"
    curriculum:
      stage: "advanced_empirical_research"
      topics:
        - "potential_outcomes"
        - "rdd"
    data_structures: ["cross-section", "pooled", "panel"]
    estimators: ["RDD"]
    purpose: "Estimate causal effects near a treatment assignment cutoff under continuity of potential outcomes around the threshold."
    assumptions:
      - "A running variable and cutoff define treatment assignment."
      - "Potential outcomes are smooth through the cutoff absent treatment."
      - "Units cannot precisely manipulate assignment around the cutoff, or manipulation is diagnosed and addressed."
      - "The bandwidth, polynomial/order choices, and inference method are registered before estimation."
    required_pap_fields:
      - "rdd_block.running_variable"
      - "rdd_block.cutoff"
      - "rdd_block.bandwidth_rule"
      - "rdd_block.manipulation_check"
      - "identification.outcome_variable"
      - "identification.treatment_variable"
    diagnostics:
      - "Check density or manipulation around the cutoff."
      - "Assess covariate continuity near the cutoff."
      - "Report sensitivity to bandwidth and functional-form choices."
      - "Separate sharp and fuzzy RD designs explicitly."
    blocks_or_warnings:
      - "Block RDD without a registered running variable and cutoff."
      - "Warn when no manipulation or density check is registered."
      - "Warn when bandwidth sensitivity is missing."
    sources:
      - {id: "angrist_pischke_mhe", chapters: ["6"]}
  matching:
    name: "Matching / Propensity Score Preprocessing"
    status: "starter"
    curriculum:
      stage: "advanced_empirical_research"
      topics:
        - "potential_outcomes"
        - "matching"
    data_structures: ["cross-section", "pooled"]
    estimators: ["Matching", "PropensityScore", "Mahalanobis", "EntropyBalance"]
    purpose: "Improve treated-control comparability on pre-treatment covariates before estimating treatment effects."
    assumptions:
      - "The covariates used for matching are measured before treatment."
      - "Selection into treatment is ignorable after the registered covariates, or the analysis is described as design support rather than causal proof."
      - "Treated and comparison units have common support."
      - "Post-matching outcome analysis respects the matched design and uncertainty."
    required_pap_fields:
      - "matching_block.method"
      - "matching_block.pre_treatment_covariates"
      - "matching_block.estimand"
      - "matching_block.balance_diagnostics"
      - "identification.outcome_variable"
      - "identification.treatment_variable"
    diagnostics:
      - "Report balance before and after matching."
      - "Inspect common support and discarded units."
      - "Report effective sample size and whether matching changed the target population."
    blocks_or_warnings:
      - "Block matching on post-treatment variables."
      - "Warn when balance remains poor after matching."
      - "Warn when discarded units make the estimand unclear."
    sources:
      - {id: "rosenbaum_rubin_1983"}
      - {id: "world_bank_impact_eval"}
  experimental_rct:
    name: "Randomized Controlled Trials / Experimental Methods"
    status: "starter"
    curriculum:
      stage: "advanced_empirical_research"
      topics:
        - "potential_outcomes"
        - "randomized_control_trials"
    data_structures: ["cross-section", "pooled", "panel"]
    estimators: ["RCT", "RandomizedExperiment", "RandomizedControlledTrial", "ITT", "ATE", "ATT", "ToT", "LATE"]
    purpose: "Estimate causal effects from randomized assignment while keeping the target estimand, assignment process, compliance, attrition, and spillovers explicit."
    assumptions:
      - "Treatment assignment is randomized according to a documented and reproducible assignment rule."
      - "The estimand is declared before analysis, such as ITT, ATE, ATT/ToT, or LATE."
      - "Interference, attrition, noncompliance, and implementation deviations are checked before causal claims."
      - "Inference matches the randomization unit and any clustering or stratification."
    required_pap_fields:
      - "rct_block.randomization_unit"
      - "rct_block.assignment_variable"
      - "rct_block.treatment_arms"
      - "rct_block.estimand"
      - "identification.outcome_variable"
      - "identification.treatment_variable"
      - "identification.standard_errors"
    diagnostics:
      - "Report baseline balance and assignment reproducibility."
      - "Report compliance/take-up when estimating ATT/ToT or LATE."
      - "Report attrition, spillover checks, and a SUTVA rationale."
      - "Cluster at the randomization unit when assignment is clustered, or document a valid randomization-inference plan."
    blocks_or_warnings:
      - "Block RCT analysis without randomization unit, assignment variable, treatment arms, or estimand."
      - "Block LATE when compliance/take-up and exclusion/monotonicity arguments are missing."
      - "Block unqualified ATE claims when assignment is an encouragement or compliance is imperfect."
      - "Block cluster-randomized designs that omit the cluster level or cluster below the randomization unit."
      - "Warn when attrition, spillovers, power, trial registration, SUTVA rationale, or PAP registration are missing."
    sources:
      - {id: "jpal_randomization"}
      - {id: "jpal_data_analysis"}
      - {id: "bedecarrats_guerin_roubaud_2015"}
      - {id: "world_bank_impact_eval"}
  synthetic_control:
    name: "Synthetic Control"
    status: "starter"
    curriculum:
      stage: "advanced_empirical_research"
      topics:
        - "potential_outcomes"
        - "synthetic_control"
    data_structures: ["panel"]
    estimators: ["SyntheticControl", "AugmentedSyntheticControl", "SyntheticDiD"]
    purpose: "Estimate effects for one or a few treated aggregate units using weighted donor units that match pre-treatment outcomes or predictors."
    assumptions:
      - "A credible donor pool is defined before estimation."
      - "The treated unit has enough pre-treatment history to assess fit."
      - "Donor units are not affected by the treatment or spillovers."
      - "The outcome path is comparable after weighting."
    required_pap_fields:
      - "synthetic_control_block.treated_unit"
      - "synthetic_control_block.donor_pool"
      - "synthetic_control_block.intervention_time"
      - "synthetic_control_block.predictors"
      - "synthetic_control_block.placebo_tests"
      - "identification.outcome_variable"
    diagnostics:
      - "Report pre-treatment fit and predictor balance."
      - "Report donor weights."
      - "Run placebo or permutation checks where feasible."
      - "Test sensitivity to donor-pool exclusions."
    blocks_or_warnings:
      - "Block when treated unit, intervention time, or donor pool is missing."
      - "Warn when pre-treatment fit is poor."
      - "Warn when the donor pool includes potentially treated or contaminated units."
    sources:
      - {id: "abadie_gardeazabal_2003"}
      - {id: "abadie_diamond_hainmueller_2010"}
      - {id: "world_bank_impact_eval"}
  nonlinear_did:
    name: "Nonlinear Difference-in-Differences"
    status: "starter"
    curriculum:
      stage: "advanced_empirical_research"
      topics:
        - "potential_outcomes"
        - "did_staggered"
    data_structures: ["panel", "pooled"]
    estimators: ["NonlinearDiD", "PoissonDiD", "LogitDiD", "DRDID"]
    purpose: "Handle DiD designs where the outcome, link function, or target effect is nonlinear and a linear TWFE coefficient is not the desired estimand."
    assumptions:
      - "The target scale and estimand are stated before estimation."
      - "Parallel trends or a design-specific substitute is stated on the relevant scale."
      - "Treatment timing and comparison groups are registered."
      - "Functional-form sensitivity is acknowledged and diagnosed."
    required_pap_fields:
      - "nonlinear_did_block.outcome_family"
      - "nonlinear_did_block.target_scale"
      - "did_block.control_group"
      - "did_block.staggered_adoption"
      - "identification.clustering"
    diagnostics:
      - "Report the estimand scale and marginal effect or ATT transformation."
      - "Check functional-form sensitivity where feasible."
      - "Use DiD diagnostics for timing, comparison groups, and clustering."
    blocks_or_warnings:
      - "Block silent interpretation of nonlinear coefficients as level effects."
      - "Block missing comparison-group justification."
      - "Warn when the target scale is unclear."
    sources:
      - {id: "wooldridge_nonlinear_did_2023"}
      - {id: "callaway_santanna_2021"}
  gmm:
    name: "Generalized Method of Moments"
    status: "starter"
    curriculum:
      stage: "theoretical_microfoundations"
      topics:
        - "gmm"
        - "asymptotic_theory"
    data_structures: ["cross-section", "time-series", "panel"]
    estimators: ["GMM", "IVGMM", "DynamicPanelGMM"]
    purpose: "Estimate parameters from moment restrictions when the model is defined by orthogonality or equilibrium conditions."
    assumptions:
      - "Moment conditions are explicitly derived and registered."
      - "Identification rank and parameter count are checked."
      - "The weighting matrix and covariance estimator are documented."
      - "Overidentification tests are interpreted as diagnostics, not proof of validity."
    required_pap_fields:
      - "gmm_block.moment_conditions"
      - "gmm_block.parameters"
      - "gmm_block.instruments"
      - "gmm_block.weighting_matrix"
      - "gmm_block.identification_rank"
    diagnostics:
      - "Check moment-condition dimensions and identification."
      - "Report overidentification diagnostics when overidentified."
      - "Report sensitivity to weighting matrix and instrument set."
    blocks_or_warnings:
      - "Block GMM without explicit moment conditions."
      - "Block if there are fewer valid moments than parameters."
      - "Warn when many instruments may weaken finite-sample performance."
    sources:
      - {id: "hansen_1982"}
      - {id: "greene_econometric_analysis"}
      - {id: "wooldridge_cross_section_panel"}
  limited_dependent:
    name: "Limited Dependent Variable Models"
    status: "starter"
    curriculum:
      stage: "identification_pivot"
      topics:
        - "limited_dependent"
        - "binary_dummy_variables"
    data_structures: ["cross-section", "pooled", "panel"]
    estimators: ["Logit", "ConditionalLogit", "MixedLogit", "Probit", "Tobit", "Poisson", "NegativeBinomial", "OrderedLogit", "MultinomialLogit"]
    purpose: "Model binary, censored, truncated, ordered, multinomial, or count outcomes with estimators and interpretations suited to the outcome support."
    assumptions:
      - "The outcome type and support are declared before choosing the estimator."
      - "Coefficients are not reported as marginal effects unless transformed."
      - "Functional form, link function, and distributional assumptions are documented."
      - "Convergence and sparse-cell risks are checked."
    required_pap_fields:
      - "limited_dependent_block.outcome_type"
      - "limited_dependent_block.link_or_family"
      - "limited_dependent_block.target_effect"
      - "limited_dependent_block.marginal_effect_plan"
      - "identification.covariates"
    diagnostics:
      - "Report marginal effects or predicted probabilities when appropriate."
      - "Check convergence and separation for binary models."
      - "Check overdispersion for count models."
    blocks_or_warnings:
      - "Block interpreting logit/probit coefficients as probability effects."
      - "Warn on convergence failure or separation."
      - "Warn when a count model ignores overdispersion."
    sources:
      - {id: "greene_econometric_analysis"}
      - {id: "wooldridge_cross_section_panel"}
      - {id: "stock_watson_intro_econometrics"}
  time_series:
    name: "Time-Series Econometrics"
    status: "starter"
    curriculum:
      stage: "theoretical_microfoundations"
      topics:
        - "time_series_dynamics"
        - "asymptotic_theory"
    data_structures: ["time-series"]
    estimators: ["ARIMA", "ARMAX", "VAR", "VECM", "ARDL", "HACRegression"]
    purpose: "Model serial dependence, dynamics, forecasting, or time-series causal/regression designs with explicit attention to stationarity and temporal ordering."
    assumptions:
      - "The time index and frequency are declared."
      - "Stationarity, trends, seasonality, and breaks are addressed before estimation."
      - "Lag order and forecast horizon are registered."
      - "Inference accounts for serial correlation when regression is used."
    required_pap_fields:
      - "time_series_block.time_index"
      - "time_series_block.frequency"
      - "time_series_block.stationarity_plan"
      - "time_series_block.lag_order_plan"
      - "time_series_block.forecast_or_causal_target"
    diagnostics:
      - "Inspect time plots, autocorrelation, and partial autocorrelation."
      - "Run unit-root or stationarity checks where relevant."
      - "Report lag-selection criteria and residual diagnostics."
      - "Guard against look-ahead bias in forecasting."
    blocks_or_warnings:
      - "Block time-series regression with no time index."
      - "Warn on likely spurious regression with trending nonstationary series."
      - "Warn when forecast evaluation uses future information."
    sources:
      - {id: "stock_watson_intro_econometrics"}
      - {id: "greene_econometric_analysis"}
      - {id: "box_jenkins_reinsel_ljung_2015"}
  mle:
    name: "Maximum Likelihood Estimation"
    status: "reviewed"
    curriculum:
      stage: "theoretical_microfoundations"
      topics: ["maximum_likelihood", "asymptotic_theory"]
    data_structures: ["cross-section", "pooled", "panel", "time-series"]
    estimators: ["MLE", "QMLE"]
    purpose: "Estimate parameters by maximizing a likelihood implied by a declared distributional model, with inference from the information matrix."
    assumptions:
      - "The parametric density/likelihood is explicitly specified."
      - "The likelihood is correctly specified, or quasi-MLE with robust inference is used and stated."
      - "Optimization convergence and identification are checked."
      - "Standard errors come from the information matrix, or a robust sandwich under possible misspecification."
    required_pap_fields:
      - "mle_block.distribution"
      - "mle_block.likelihood"
      - "mle_block.parameters"
      - "mle_block.optimizer"
      - "mle_block.standard_error_type"
    diagnostics:
      - "Report convergence status and starting-value sensitivity."
      - "Check identification and the information-matrix conditioning."
      - "Use likelihood-ratio, Wald, or LM tests appropriately."
      - "Prefer robust (sandwich) standard errors when the density may be misspecified."
    blocks_or_warnings:
      - "Block MLE without a declared distribution/likelihood."
      - "Warn when convergence is not confirmed."
      - "Warn when non-robust standard errors are used under a quasi-likelihood interpretation."
    sources:
      - {id: "greene_econometric_analysis"}
      - {id: "hansen_econometrics_2022"}
      - {id: "wooldridge_cross_section_panel"}
  dml:
    name: "Double / Debiased Machine Learning"
    status: "pending_human_review"
    curriculum:
      stage: "advanced_empirical_research"
      topics: ["double_machine_learning", "potential_outcomes"]
    data_structures: ["cross-section", "panel"]
    estimators: ["DML", "DoubleML", "PLR", "PLIV", "IRM", "CausalForest"]
    purpose: "Estimate a low-dimensional causal parameter in the presence of high-dimensional nuisance functions using Neyman-orthogonal scores and cross-fitting."
    assumptions:
      - "The target parameter and identification (unconfoundedness or a valid instrument) are stated before estimation."
      - "The moment/score used for the target parameter is Neyman-orthogonal."
      - "Nuisance functions are estimated by machine learning with cross-fitting (sample splitting)."
      - "Regularization/overfitting bias is controlled through orthogonalization and cross-fitting."
    required_pap_fields:
      - "dml_block.target_parameter"
      - "dml_block.identification"
      - "dml_block.nuisance_learners"
      - "dml_block.cross_fitting_folds"
      - "dml_block.orthogonal_score"
    diagnostics:
      - "Report the number of cross-fitting folds and repetitions."
      - "Report nuisance-learner choices and tuning."
      - "Report sensitivity to learners and folds."
      - "For heterogeneous effects, report honest inference (e.g., causal forests)."
    blocks_or_warnings:
      - "Block causal DML without a stated identification assumption."
      - "Warn when cross-fitting is not used (regularization bias)."
      - "Warn when the score is not orthogonal to the nuisance functions."
    sources:
      - {id: "chernozhukov_dml_2018"}
      - {id: "wager_athey_2018"}
      - {id: "athey_imbens_2019"}
  structural:
    name: "Structural Estimation (IO / BLP)"
    status: "reviewed"
    curriculum:
      stage: "advanced_empirical_research"
      topics: ["structural_blp", "potential_outcomes"]
    data_structures: ["cross-section", "panel"]
    estimators: ["BLP", "StructuralGMM", "StructuralMLE", "DiscreteChoiceDemand"]
    purpose: "Estimate structural (deep) parameters from an economic model and equilibrium/optimality restrictions, enabling model-driven counterfactuals."
    assumptions:
      - "The economic model, deep parameters, and equilibrium/optimality conditions are stated."
      - "Endogenous variables (for example prices) are instrumented with a defensible instrument set."
      - "Identification of the structural parameters from the moments/likelihood is argued."
      - "Counterfactuals are tied to the estimated model, with stated out-of-sample caveats."
    required_pap_fields:
      - "structural_block.model"
      - "structural_block.parameters"
      - "structural_block.moment_or_likelihood"
      - "structural_block.instruments"
      - "structural_block.identification_argument"
    diagnostics:
      - "Report the estimation moments/likelihood and the instruments used for endogenous variables."
      - "Report identification and fit diagnostics."
      - "Report sensitivity of counterfactuals to key parameters and assumptions."
    blocks_or_warnings:
      - "Block structural counterfactuals without a stated model and identification argument."
      - "Warn when endogenous prices/choices are not instrumented."
      - "Warn when counterfactuals extrapolate far beyond the estimation support."
    sources:
      - {id: "berry_levinsohn_pakes_1995"}
      - {id: "train_discrete_choice_2009"}
      - {id: "hayashi_econometrics_2000"}
  nonparametric:
    name: "Nonparametric / Semiparametric Estimation"
    status: "reviewed"
    curriculum:
      stage: "theoretical_microfoundations"
      topics: ["nonparametric_semiparametric", "asymptotic_theory"]
    data_structures: ["cross-section", "pooled", "panel", "time-series"]
    estimators: ["KernelRegression", "LocalPolynomial", "SeriesEstimator", "LOESS"]
    purpose: "Estimate conditional means or densities with flexible functional forms that do not impose a global parametric shape."
    assumptions:
      - "The estimand (for example the conditional mean function) and the smoothing target are stated."
      - "Bandwidth or series-length selection is data-driven and disclosed."
      - "The dimension of continuous conditioning variables is small enough to avoid the curse of dimensionality."
      - "Boundary bias and inference (bias-corrected or undersmoothed) are addressed."
    required_pap_fields:
      - "nonparametric_block.estimator"
      - "nonparametric_block.bandwidth_rule"
      - "nonparametric_block.continuous_regressors"
      - "nonparametric_block.inference_plan"
    diagnostics:
      - "Report the bandwidth/series-selection rule and sensitivity to it."
      - "Report the number of continuous conditioning variables (curse of dimensionality)."
      - "Address boundary bias and the inference method for confidence bands."
    blocks_or_warnings:
      - "Warn when bandwidth selection is undisclosed or arbitrary."
      - "Warn when many continuous regressors make nonparametric estimation infeasible."
    sources:
      - {id: "li_racine_nonparametric_2007"}
      - {id: "hansen_econometrics_2022"}
      - {id: "greene_econometric_analysis"}
  bayesian:
    name: "Bayesian Econometrics"
    status: "reviewed"
    curriculum:
      stage: "theoretical_microfoundations"
      topics: ["bayesian_inference", "maximum_likelihood"]
    data_structures: ["cross-section", "pooled", "panel", "time-series"]
    estimators: ["BayesianRegression", "MCMC", "GibbsSampler", "BayesianVAR", "HierarchicalBayes"]
    purpose: "Estimate a posterior distribution over parameters by combining a likelihood with declared priors, typically via MCMC."
    assumptions:
      - "Priors are declared and justified, and the likelihood is stated."
      - "Posterior sampling (MCMC) convergence is checked."
      - "Prior sensitivity is assessed."
      - "Reported quantities (posterior means, credible intervals) are interpreted as Bayesian, not frequentist."
    required_pap_fields:
      - "bayesian_block.priors"
      - "bayesian_block.likelihood"
      - "bayesian_block.sampler"
      - "bayesian_block.convergence_plan"
      - "bayesian_block.prior_sensitivity_plan"
    diagnostics:
      - "Report convergence diagnostics (for example R-hat, effective sample size, trace plots)."
      - "Report prior specification and a prior-sensitivity analysis."
      - "Report credible intervals and posterior predictive checks."
    blocks_or_warnings:
      - "Block Bayesian estimates without declared priors."
      - "Warn when MCMC convergence is not demonstrated."
      - "Warn when credible intervals are reported as frequentist confidence intervals."
    sources:
      - {id: "koop_poirier_tobias_2007"}
      - {id: "greene_econometric_analysis"}
  garch:
    name: "Volatility Models (ARCH / GARCH)"
    status: "reviewed"
    curriculum:
      stage: "theoretical_microfoundations"
      topics: ["financial_volatility", "time_series_dynamics"]
    data_structures: ["time-series"]
    estimators: ["ARCH", "GARCH", "EGARCH", "GJR-GARCH"]
    purpose: "Model the conditional variance of a time series (volatility clustering) alongside its conditional mean."
    assumptions:
      - "The conditional-mean model is specified before the conditional-variance model."
      - "The residuals show ARCH effects that justify a volatility model."
      - "Stationarity and positivity constraints on the variance parameters hold (for example non-negative coefficients and persistence below one)."
      - "The innovation distribution (normal, Student-t) is stated."
    required_pap_fields:
      - "garch_block.mean_model"
      - "garch_block.variance_model"
      - "garch_block.innovation_distribution"
      - "garch_block.arch_test_plan"
    diagnostics:
      - "Test for ARCH effects (Engle LM test) before fitting."
      - "Check parameter constraints and persistence (for example alpha plus beta below one for GARCH(1,1))."
      - "Check standardized-residual diagnostics (Ljung-Box and the assumed distribution)."
    blocks_or_warnings:
      - "Warn when a volatility model is fit without evidence of ARCH effects."
      - "Warn when variance-parameter constraints are violated (non-stationary variance)."
    sources:
      - {id: "tsay_financial_time_series_2010"}
      - {id: "box_jenkins_reinsel_ljung_2015"}
