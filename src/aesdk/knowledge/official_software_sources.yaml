      - "heterogeneous treatment effects and orthogonal/DML learners"
  grf_r:
    language: "r"
    url: "https://grf-labs.github.io/grf/"
    sdk_use:
      - "causal forests for heterogeneous treatment effects"
  pyblp_py:
    language: "python"
    url: "https://pyblp.readthedocs.io/en/stable/"
    sdk_use:
      - "BLP random-coefficients demand estimation"
  arch_py:
    language: "python"
    url: "https://arch.readthedocs.io/en/latest/univariate/introduction.html"
