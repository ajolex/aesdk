version: "0.1.0"
policy:
  use: "Official package or vendor documentation for agent-facing code recipes."
  refresh: "Verify URLs and package APIs before each public release."
sources:
  statsmodels:
    language: "python"
    url: "https://www.statsmodels.org/stable/generated/statsmodels.regression.linear_model.OLSResults.get_robustcov_results.html"
    sdk_use:
      - "OLS and robust covariance examples"
      - "clustered covariance options"
  statsmodels_genericmle:
    language: "python"
    url: "https://www.statsmodels.org/stable/dev/generated/statsmodels.base.model.GenericLikelihoodModel.html"
    sdk_use:
      - "custom maximum-likelihood estimation"
      - "robust (sandwich) standard errors under misspecification"
  r_stats4_mle:
    language: "r"
    url: "https://stat.ethz.ch/R-manual/R-devel/library/stats4/html/mle.html"
    sdk_use:
      - "maximum-likelihood estimation and profiling in base R"
  statsmodels_nonparametric:
    language: "python"
    url: "https://www.statsmodels.org/stable/nonparametric.html"
    sdk_use:
      - "kernel regression and kernel density estimation"
  np_r:
    language: "r"
    url: "https://cran.r-project.org/package=np"
    sdk_use:
      - "nonparametric kernel regression and bandwidth selection"
  doubleml_py:
    language: "python"
    url: "https://docs.doubleml.org/stable/index.html"
    sdk_use:
      - "double/debiased machine learning with cross-fitting"
  doubleml_r:
    language: "r"
    url: "https://docs.doubleml.org/r/stable/"
    sdk_use:
      - "double/debiased machine learning with cross-fitting"
