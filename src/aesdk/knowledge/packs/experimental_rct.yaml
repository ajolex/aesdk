version: "0.1.0"
method_id: "experimental_rct"
name: "Randomized Controlled Trials / Experimental Methods"
organization:
  type: "method_topic_pack"
  curriculum_stage: "advanced_empirical_research"
  curriculum_topics: ["potential_outcomes", "randomized_control_trials"]
  authority_policy: "Organized by econometric topic; sources support the guardrails but do not define the file identity."
maturity:
  status: "pending_human_review"
  source_review: "ai_source_audited_pending_human_review"
  estimator_choice: "medium"
  diagnostics: "medium"
  code_recipes: "starter"
scope:
  use_when:
    - "Treatment or encouragement is assigned by a randomized rule."
    - "The research team can document the assignment unit, treatment arms, and assignment probabilities."
    - "The target estimand is ITT, ATE, ATT/ToT, LATE, or a registered experimental contrast."
  do_not_use_when:
    - "Treatment assignment was not randomized or the assignment process cannot be reconstructed."
    - "Noncompliance, attrition, or spillovers make the declared estimand unsupported."
estimand:
  default: "Intention-to-treat effect of assignment; ATE under perfect compliance and no attrition/spillovers; LATE for compliers under IV-style assumptions."
  agent_instruction: "State whether the target is ITT, ATE, ATT/ToT, or LATE before choosing code."
decision_tree:
  - id: "rct-design-001"
    if: "Assignment and treatment receipt coincide with perfect compliance."
    then: "Estimate ATE/ITT as the treatment-control mean difference or regression on assignment."
  - id: "rct-design-002"
    if: "Assignment is randomized but take-up is imperfect."
    then: "Report ITT and, if justified, use assignment as an instrument for treatment receipt to estimate LATE."
  - id: "rct-design-003"
    if: "Randomization is clustered or stratified."
    then: "Respect the randomization unit in inference and include the registered cluster level and strata/covariates."
  - id: "rct-design-004"
    if: "Attrition or spillovers differ by assignment."
    then: "Do not report unqualified ATE; use bounds, sensitivity checks, or redesign the estimand."
assumptions:
  - id: "rct-assumption-001"
    plain: "Assignment was random and reproducible."
    formal: "The assignment variable is generated by a documented randomization protocol with known assignment probabilities."
    evidence: "Randomization seed, assignment file, treatment-arm ratios, strata, or field protocol."
  - id: "rct-assumption-002"
    plain: "The reported estimand matches compliance."
    formal: "ATE/ITT/ATT/LATE are distinguished; LATE uses randomized assignment as an instrument for receipt."
    evidence: "Compliance or take-up variable, first-stage/take-up rate, and estimand declaration."
  - id: "rct-assumption-003"
    plain: "Missing outcomes and spillovers do not silently change the estimand."
    formal: "Attrition and interference are checked and handled through registered diagnostics, bounds, or sensitivity analysis."
    evidence: "Attrition table, spillover plan, SUTVA discussion, or bounds plan."
required_inputs:
  - id: "rct-input-001"
    name: "randomization_unit"
    reason: "Determines assignment, power, and clustering."
  - id: "rct-input-002"
    name: "assignment_variable"
    reason: "Defines randomized offer or treatment assignment."
  - id: "rct-input-003"
    name: "treatment_arms"
    reason: "Defines the experimental contrast."
  - id: "rct-input-004"
    name: "estimand"
    reason: "Prevents mixing ITT, ATE, ATT/ToT, and LATE."
  - id: "rct-input-005"
    name: "assignment_probability"
    reason: "Documents the randomization design and weights if unequal assignment is used."
  - id: "rct-input-006"
    name: "assignment_file_or_seed"
    reason: "Allows the assignment process to be audited and reproduced."
  - id: "rct-input-007"
    name: "sutva_rationale"
    reason: "Prevents spillovers and multiple treatment versions from being treated as invisible."
diagnostics:
  - id: "rct-diagnostic-001"
    name: "baseline_balance"
    instruction: "Report baseline balance across treatment arms, especially for key pre-treatment covariates and strata."
  - id: "rct-diagnostic-002"
    name: "compliance"
    instruction: "Report take-up, crossovers, one-sided or two-sided noncompliance, and first-stage strength for LATE."
  - id: "rct-diagnostic-003"
    name: "attrition"
    instruction: "Report attrition by arm and add a bounds, weighting, or sensitivity plan when attrition is differential."
  - id: "rct-diagnostic-004"
    name: "spillovers"
    instruction: "Document interference risk, SUTVA rationale, and whether the randomization unit prevents or measures spillovers."
  - id: "rct-diagnostic-005"
    name: "randomization_inference"
    instruction: "Consider randomization inference for finite-sample or sharp-null tests when appropriate."
failure_modes:
  - id: "rct-failure-001"
    risk: "ATE claimed when assignment is only an encouragement and compliance is imperfect."
    response: "Block ATE; report ITT or justify LATE with compliance assumptions."
  - id: "rct-failure-002"
    risk: "Cluster-randomized design analyzed with individual iid standard errors."
    response: "Block or require clustered/randomization-unit inference with the cluster level declared."
  - id: "rct-failure-003"
    risk: "Differential attrition is ignored."
    response: "Warn or block under strict conformance; require bounds or sensitivity analysis."
  - id: "rct-failure-004"
    risk: "Spillovers contaminate the control group."
    response: "Require spillover-aware estimand, design adjustment, or sensitivity analysis."
code_recipes:
  - id: "rct-python-statsmodels-itt"
    language: "python"
    package: "statsmodels"
    source: "statsmodels"
    template: |
      import statsmodels.formula.api as smf

      fit = smf.ols("outcome ~ assigned_treatment + baseline_covariate", data=df).fit(cov_type="HC1")
      print(fit.summary())
  - id: "rct-r-lm-itt"
    language: "r"
    package: "stats"
    source: "r_stats_lm"
    template: |
      fit <- lm(outcome ~ assigned_treatment + baseline_covariate, data = df)
      summary(fit)
  - id: "rct-stata-regress-itt"
    language: "stata"
    package: "Stata"
    source: "stata_regress"
    template: |
      regress outcome assigned_treatment baseline_covariate, vce(robust)
      estimates table, b se p
reporting_checklist:
  - "State randomization unit, assignment variable, treatment arms, and assignment probability."
  - "Archive a random seed, assignment file, public lottery record, or assignment script."
  - "State whether the reported estimand is ITT, ATE, ATT/ToT, or LATE."
  - "Report baseline balance, compliance/take-up, attrition, spillover diagnostics, and SUTVA rationale."
  - "Use clustering or randomization inference that matches the assignment design."
  - "Discuss external-validity and implementation-scope limits."
source_anchors:
  - source_id: "jpal_randomization"
    topics:
      - "randomization concepts, ATE intuition, assignment methods, units, strata, and replicable seeds"
  - source_id: "jpal_data_analysis"
    topics:
      - "ATE, LATE, treatment-on-treated, compliance, attrition, spillovers, and randomization inference"
  - source_id: "bedecarrats_guerin_roubaud_2015"
    topics:
      - "RCT scope limits and political-economy cautions"
    local_pdf_pages: [1, 2, 3]
  - source_id: "world_bank_impact_eval"
    topics:
      - "impact-evaluation randomized assignment and operational planning"
audit:
  stage: "ai_reviewed_pending_human"
  audit_report: "docs/deep_knowledge_audit_report.yaml"
  notes:
    - "J-PAL public resources were verified online before registration."
    - "Local critical source is used to prevent overclaiming RCTs as universal gold-standard answers."
