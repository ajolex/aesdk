  - source_id: "wooldridge_nonlinear_did_2023"
    topics:
      - "nonlinear panel DiD extensions"
  - source_id: "roth_santanna_bilinski_poe_2023"
    topics:
      - "synthesis of the recent DiD econometrics literature"
      - "parallel trends, no anticipation, staggered timing, and estimator choice"
  - source_id: "rambachan_roth_2023"
