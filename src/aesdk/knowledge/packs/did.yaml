version: "0.1.0"
method_id: "did"
name: "Differences-in-Differences"
organization:
  type: "method_topic_pack"
  curriculum_stage: "advanced_empirical_research"
  curriculum_topics: ["potential_outcomes", "did_staggered"]
  authority_policy: "Organized by econometric topic; sources support the guardrails but do not define the file identity."
maturity:
  status: "reviewed_guardrail"
  source_review: "partial_multi_source"
  estimator_choice: "medium"
  diagnostics: "medium"
  code_recipes: "starter"
scope:
  use_when:
    - "A treatment, policy, or exposure changes for one group but not for a credible comparison group."
    - "Outcome data are observed before and after treatment."
    - "The research question targets a treatment effect under a parallel-trends style design."
  do_not_use_when:
    - "There is no pre-treatment outcome information."
    - "The comparison group is undefined or substantively incomparable."
    - "Treatment timing is staggered and the agent plans plain TWFE without a modern estimator or decomposition."
estimand:
  default: "Average treatment effect on the treated for the registered comparison and timing design."
  agent_instruction: "Name the treated group, comparison group, timing design, and whether effects are static, dynamic, or cohort-specific."
decision_tree:
  - id: "did-design-001"
    if: "There are exactly two periods and a single treated cohort."
    then: "Use a simple DiD contrast or an equivalent regression with treatment, post, and interaction terms."
  - id: "did-design-002"
    if: "There are many periods but all treated units adopt at the same time."
    then: "Use TWFE or event-study regression, with clustered inference and registered pre-trend checks."
  - id: "did-design-003"
    if: "Treatment adoption is staggered across cohorts."
    then: "Prefer group-time ATT, interaction-weighted event study, stacked DiD, or a documented decomposition strategy; block unqualified plain TWFE."
  - id: "did-design-004"
    if: "The outcome is nonlinear or binary and the target is not a linear mean effect."
    then: "Escalate to nonlinear DiD guidance; do not silently use linear TWFE as the estimand."
  - id: "did-design-005"
    if: "Treatment turns on and off, or a unit is treated more than once (non-absorbing)."
    then: "Use estimators built for switching treatments (de Chaisemartin & D'Haultfoeuille 2020/2024); state any no-carryover assumption. Do not use standard absorbing-treatment DiD estimators."
  - id: "did-design-006"
    if: "Treatment is continuous or multi-valued (a dose or intensity)."
    then: "Use continuous/multi-valued DiD estimators (Callaway, Goodman-Bacon & Sant'Anna; de Chaisemartin & D'Haultfoeuille) and define the dose-specific estimand; a single binary indicator misstates it."
assumptions:
  - id: "did-assumption-001"
    plain: "The comparison group shows what would have happened to treated units without treatment."
    formal: "Parallel trends or a design-specific conditional parallel trends assumption for the registered estimand."
    evidence: "Pre-treatment outcome paths, event-study leads, placebo outcomes, institutional timing argument."
  - id: "did-assumption-002"
    plain: "Treatment timing is measured correctly and anticipation is handled."
    formal: "Potential outcomes before treatment are not already affected by known future treatment unless anticipation periods are modeled."
    evidence: "Known announcement dates, excluded anticipation window, or event-study lead pattern."
  - id: "did-assumption-003"
    plain: "Inference reflects repeated observations and grouped treatment assignment."
    formal: "Standard errors allow within-cluster dependence at the assignment or unit level, with stronger methods for few clusters."
    evidence: "Registered clustering level, cluster count, and small-cluster remedy when needed."
  - id: "did-assumption-004"
    plain: "Units do not change behavior before treatment starts (no anticipation)."
    formal: "No-anticipation: pre-treatment outcomes equal untreated potential outcomes; ATT(t)=0 for pre-periods."
    evidence: "Announcement vs implementation dates, an explicitly modeled anticipation window, or flat event-study leads."
  - id: "did-assumption-005"
    plain: "Parallel trends is stated for one scale of the outcome; it usually cannot hold in both levels and logs."
    formal: "Parallel trends is functional-form dependent (Roth & Sant'Anna 2023) except under strong conditions."
    evidence: "Declared outcome transformation (levels/logs) and, where possible, a falsification test for insensitivity to functional form."
  - id: "did-assumption-006"
    plain: "When comparison groups differ on covariates, parallel trends is only credible after conditioning on them."
    formal: "Conditional parallel trends given covariates X; recovered by regression adjustment, IPW, or doubly-robust estimators."
    evidence: "Covariate balance/overlap checks and a doubly-robust or IPW estimator rather than TWFE with linear covariates."
required_inputs:
  - id: "did-input-001"
    name: "outcome_variable"
    reason: "The outcome whose change is compared."
  - id: "did-input-002"
    name: "treatment_variable"
    reason: "Binary or intensity treatment indicator aligned with timing."
  - id: "did-input-003"
    name: "unit_id"
    reason: "Required for panel DiD and clustered inference."
  - id: "did-input-004"
    name: "time_id"
    reason: "Required to identify pre/post periods, event time, and fixed effects."
  - id: "did-input-005"
    name: "control_group"
    reason: "Never-treated, not-yet-treated, matched, or otherwise justified comparison group."
  - id: "did-input-006"
    name: "clustering_level"
    reason: "Prevents invalid precision from serial correlation or grouped assignment."
diagnostics:
  - id: "did-diagnostic-001"
    name: "pre_trend"
    instruction: "Estimate and report pre-treatment leads or a registered substitute."
  - id: "did-diagnostic-002"
    name: "event_study"
    instruction: "Show dynamic effects when multiple periods are available."
  - id: "did-diagnostic-003"
    name: "comparison_group_audit"
    instruction: "Describe which units identify the counterfactual and why they are credible."
  - id: "did-diagnostic-004"
    name: "cluster_audit"
    instruction: "Report clustering level and number of clusters."
  - id: "did-diagnostic-005"
    name: "sensitivity_analysis"
    instruction: "Report a sensitivity analysis to parallel-trends violations (Rambachan & Roth honest DiD) and the breakdown point, instead of relying on an underpowered pre-trend test."
  - id: "did-diagnostic-006"
    name: "functional_form_falsification"
    instruction: "State the outcome scale (levels/logs) parallel trends is assumed in; where possible run the Roth-Sant'Anna test for insensitivity to functional form."
  - id: "did-diagnostic-007"
    name: "uniform_event_study_bands"
    instruction: "For event studies, report uniform sup-t confidence bands (multiplier bootstrap), not just pointwise intervals, to account for multiple testing across event time."
failure_modes:
  - id: "did-failure-001"
    risk: "No comparison-group justification."
    response: "Block causal execution until the comparison group is declared and defended."
  - id: "did-failure-002"
    risk: "Plain TWFE under staggered adoption."
    response: "Block unless the PAP registers a modern estimator, decomposition, or justified homogeneous-effects design."
  - id: "did-failure-003"
    risk: "Conventional standard errors in panel/grouped treatment."
    response: "Block and require clustered or stronger inference."
  - id: "did-failure-004"
    risk: "Treating a non-significant, underpowered pre-trend test as proof of parallel trends."
    response: "Warn; require a sensitivity analysis (Rambachan & Roth) rather than a pre-test verdict."
  - id: "did-failure-005"
    risk: "Adding covariates linearly to a TWFE regression to satisfy conditional parallel trends."
    response: "Warn; require regression adjustment, IPW, or a doubly-robust estimator instead."
code_recipes:
  - id: "did-python-pyfixest-event-study"
    language: "python"
    package: "pyfixest"
    source: "pyfixest"
    template: |
      import pyfixest as pf

      fit = pf.event_study(
          data=df,
          yname="outcome",
          idname="unit_id",
          tname="time_id",
          gname="first_treated_period",
          estimator="saturated",
      )
      print(fit.summary())
  - id: "did-r-did-att-gt"
    language: "r"
    package: "did"
    source: "did_r"
    template: |
      library(did)

      att <- att_gt(
        yname = "outcome",
        tname = "time_id",
        idname = "unit_id",
        gname = "first_treated_period",
        xformla = ~ covariate_1 + covariate_2,
        data = df,
        control_group = "notyettreated"
      )
      summary(aggte(att, type = "dynamic"))
  - id: "did-stata-xtdidregress"
    language: "stata"
    package: "Stata"
    source: "stata_didregress"
    template: |
      xtset unit_id time_id
      xtdidregress (outcome covariate_1 covariate_2) (treated), group(unit_id) time(time_id)
      estat ptrends
reporting_checklist:
  - "State the treated group, comparison group, treatment timing, and estimand."
  - "State the parallel-trends and no-anticipation assumptions, and the outcome scale (levels/logs) they are assumed in."
  - "Report the estimator and why it matches the timing design (and, if staggered, that it is heterogeneity-robust)."
  - "Show pre-trend or registered substitute diagnostics, and a sensitivity analysis to parallel-trends violations."
  - "Report clustering level, number of clusters, and small-cluster adjustments if used; for event studies, report uniform sup-t bands."
  - "If covariates are needed for identification, report a doubly-robust/IPW/regression-adjustment estimator, not TWFE-with-covariates."
  - "Separate design evidence from statistical significance."
